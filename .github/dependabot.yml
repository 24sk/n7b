version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "nitropack"
          - "h3"
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@antfu/eslint-config"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
